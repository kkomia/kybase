# kybase 管理台的站点配置（React，挂载点 id="root"）。
#
# 站点提供 SPA 回退、/api 反向代理与静态资源缓存。
# 路径与缓存头必须和后端路由保持一致，避免同一地址刷新行为不同。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传文档走这个入口，默认 1m 太小（架构允许到 200MB，见后端 MAX_UPLOAD_BYTES）
    client_max_body_size 200m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # 带内容 hash 的构建产物可以长缓存：文件名变了内容才会变
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 反代到 backend 容器的 8000（后端**不发布**宿主机端口，只从这条进）。
    # `backend` 是 compose 里的服务名，由 docker 内嵌 DNS 解析。
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # **对话是 SSE 流式**：关掉缓冲，否则用户要等整段回答写完才看到第一个字
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # SPA 回退（React Router 的客户端路由刷新时要落到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}

# kybase 完整栈：PostgreSQL + MinIO + 后端 + MCP + 前端。
#
# **这份 compose 在仓库根目录之外启动**：
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 启动后：
#   管理台      http://localhost:8080
#   REST        http://localhost:8080/api/v1
#   MCP         http://localhost:8765/mcp
#   健康检查    http://localhost:8080/api/v1/health
#   MinIO 控制台 http://localhost:9001
#
# 首次打开管理台会进入管理员创建向导；登录后在「模型」页登记嵌入模型，
# 在「API 密钥」页创建 Key。完整步骤与变量说明见 `docs/部署指南-v0.1.md`。
#
# 默认口令和桶名只适合本地试跑。对公网或多人使用前，请通过环境变量
# （或同目录 `.env`）覆盖 `KYLAB_PG_PASSWORD`、`KYLAB_S3_ACCESS_KEY`、
# `KYLAB_S3_SECRET_KEY` 与 `KYLAB_URL_SIGNING_SECRET`。
#
# 存储分工：
#   postgres    元数据 + 向量（pgvector）+ 全文（tsvector）
#   minio       原件 / Markdown 产物 / 图片
#   kybase-data 卷  DuckDB 表格副本（以及未配 S3 时的原件回退目录）
#
# 说明：schema 由应用在启动时校验并补齐，不需要手工执行 SQL。
name: kybase

services:
  # ---- PostgreSQL（含 pgvector）----
  #
  # 官方 pgvector 镜像：只带 vector 一个扩展，版本可预期。
  #
  # 选 pg17：与当前 schema 和测试环境一致；升大版本要按 PostgreSQL 的升级流程
  # 处理数据目录，不能只改 tag。
  #
  # 若需要 BM25 全文检索（pg_search）或 PostGIS，可换 paradedb/paradedb：
  # 它自带这些扩展，但社区版是 AGPLv3，且会在 public 下建与项目无关的对象。
  # 当前 schema 用的是内建 tsvector，不需要它。
  postgres:
    image: pgvector/pgvector:pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KYLAB_PG_USER:-kybase}
      POSTGRES_PASSWORD: ${KYLAB_PG_PASSWORD:-kybase-dev-secret}
      POSTGRES_DB: ${KYLAB_PG_DB:-kybase}
      # 显式指定，避免数据落进镜像声明的匿名卷而不是我们挂的目录
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - kybase-pg:/var/lib/postgresql/data
    # PG 的并行查询要共享内存，默认 64MB 偏小
    shm_size: 256mb
    # 不对外暴露 5432：库只给 compose 网络内的后端用。
    # 需要从宿主机连（调试/迁移）时取消下面两行注释。
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KYLAB_PG_USER:-kybase} -d ${KYLAB_PG_DB:-kybase}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ---- MinIO（S3 兼容对象存储）----
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # 与后端共用同一对凭据，避免"两处各写一份、改一处忘另一处"
      MINIO_ROOT_USER: ${KYLAB_S3_ACCESS_KEY:-kybase}
      MINIO_ROOT_PASSWORD: ${KYLAB_S3_SECRET_KEY:-kybase-dev-secret}
    volumes:
      - kybase-objects:/data
    ports:
      # 控制台只在宿主机本地可达；S3 API 端口供 compose 网络内的后端使用
      - "127.0.0.1:${KYLAB_MINIO_CONSOLE_PORT:-9001}:9001"
      - "127.0.0.1:${KYLAB_MINIO_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # 一次性任务：建桶。MinIO 不会自动建桶，没桶后端启动校验就会失败。
  # `mc mb` 幂等，重复跑不报错。
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_kybase: http://${KYLAB_S3_ACCESS_KEY:-kybase}:${KYLAB_S3_SECRET_KEY:-kybase-dev-secret}@minio:9000
    entrypoint:
      - /bin/sh
      - -c
      - "mc mb --ignore-existing kybase/${KYLAB_S3_BUCKET:-kybase}"
    restart: "no"

  backend:
    build:
      # **上下文是仓库根**：镜像里要装仓库自带的 skills/，
      # 而 COPY 只能从上下文里取文件（见 backend/Dockerfile 的说明）。
      # 仓库根那份 .dockerignore 负责挡住 .venv / node_modules / .git。
      context: ..
      dockerfile: backend/Dockerfile
    image: kybase-backend:${KYLAB_VERSION:-0.1.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # 数据都落在挂载卷里，容器重建不丢
      KYLAB_DATA_DIR: /data
      # 日志时间戳按服务器本地时间落下来；容器默认是 UTC。
      TZ: ${TZ:-Asia/Shanghai}
      # ---- 存储后端 ----
      # 库与对象存储只走内网服务名；宿主机不暴露端口
      KYLAB_DATABASE_URL: postgresql://${KYLAB_PG_USER:-kybase}:${KYLAB_PG_PASSWORD:-kybase-dev-secret}@postgres:5432/${KYLAB_PG_DB:-kybase}
      KYLAB_S3_ENDPOINT: http://minio:9000
      KYLAB_S3_ACCESS_KEY: ${KYLAB_S3_ACCESS_KEY:-kybase}
      KYLAB_S3_SECRET_KEY: ${KYLAB_S3_SECRET_KEY:-kybase-dev-secret}
      KYLAB_S3_BUCKET: ${KYLAB_S3_BUCKET:-kybase}
      KYLAB_S3_REGION: ${KYLAB_S3_REGION:-us-east-1}
      # 容器内网互通走 http
      KYLAB_S3_SECURE: "false"
      # ---- 应用 ----
      # 鉴权**永远生效**（没有开关）。首次打开时访问界面会进
      # 「创建管理员账号」向导；在此之前业务接口一律 401。
      # 签名下载链接用；不设则后端**拒绝签发**（而不是发一条无效链接）。
      # 不设也行：首次 setup 会自动生成一条并落库。
      KYLAB_URL_SIGNING_SECRET: ${KYLAB_URL_SIGNING_SECRET:-}
      # 允许的来源。走 nginx 同源反代时用不到，直连后端时需要
      KYLAB_CORS_ORIGINS: ${KYLAB_CORS_ORIGINS:-http://localhost:8080}
      # 内嵌消费线程：**单容器部署要留着它**，否则上传后没人处理队列
      KYLAB_RUN_WORKER: ${KYLAB_RUN_WORKER:-true}
      # ---- 对外地址（部署方填写）----
      # 填了管理台「接入」页才会给出可直接粘贴的客户端片段，MCP 的 download_url /
      # image_url 也才是绝对地址；留空只降级、不报错。
      KYLAB_MCP_PUBLIC_URL: ${KYLAB_MCP_PUBLIC_URL:-}
      KYLAB_PUBLIC_BASE_URL: ${KYLAB_PUBLIC_BASE_URL:-}
    volumes:
      - kybase-data:/data
    # 不直接对外暴露 8000：统一从 nginx 进，避免绕过反代后
    # 出现"一半请求带 X-Forwarded-*、一半不带"的排查噩梦。
    # 需要直连调试时取消下面两行的注释
    # ports:
    #   - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # MCP（Streamable HTTP）。与 backend 同一个镜像，只换入口命令。
  # 独立进程便于单独重启和限制端口；凭据与 backend 一致，不另建账号体系。
  # 每个请求都要 Authorization: Bearer <API Key>。
  mcp:
    image: kybase-backend:${KYLAB_VERSION:-0.1.0}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command:
      - python
      - -m
      - app.mcp_server.server
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "8765"
    environment:
      KYLAB_DATA_DIR: /data
      TZ: ${TZ:-Asia/Shanghai}
      KYLAB_DATABASE_URL: postgresql://${KYLAB_PG_USER:-kybase}:${KYLAB_PG_PASSWORD:-kybase-dev-secret}@postgres:5432/${KYLAB_PG_DB:-kybase}
      KYLAB_S3_ENDPOINT: http://minio:9000
      KYLAB_S3_ACCESS_KEY: ${KYLAB_S3_ACCESS_KEY:-kybase}
      KYLAB_S3_SECRET_KEY: ${KYLAB_S3_SECRET_KEY:-kybase-dev-secret}
      KYLAB_S3_BUCKET: ${KYLAB_S3_BUCKET:-kybase}
      KYLAB_S3_REGION: ${KYLAB_S3_REGION:-us-east-1}
      KYLAB_S3_SECURE: "false"
      KYLAB_URL_SIGNING_SECRET: ${KYLAB_URL_SIGNING_SECRET:-}
      KYLAB_PUBLIC_BASE_URL: ${KYLAB_PUBLIC_BASE_URL:-}
      KYLAB_MCP_PUBLIC_URL: ${KYLAB_MCP_PUBLIC_URL:-}
      # MCP 不跑摄入队列，队列消费者只属于 backend。
      KYLAB_RUN_WORKER: "false"
    volumes:
      - kybase-data:/data
    ports:
      - "${KYLAB_MCP_PORT:-8765}:8765"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(0 if s.connect_ex(('127.0.0.1', 8765)) == 0 else 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ../frontend
    image: kybase-frontend:${KYLAB_VERSION:-0.1.0}
    restart: unless-stopped
    depends_on:
      backend:
        # 等后端健康再起 nginx：否则首屏会先看到一个 502，
        # 用户以为部署失败
        condition: service_healthy
    ports:
      - "${KYLAB_HTTP_PORT:-8080}:80"

volumes:
  kybase-data:
    # 具名卷由 docker 管理，位置随平台而变。
    # 要固定到某个磁盘路径就换成 bind mount：
    #   driver_opts: { type: none, device: /srv/kybase, o: bind }
  kybase-pg:
    # PG 数据目录。**备份要在这里做**（pg_dump），不能靠拷文件：
    # 运行中的 data 目录直接拷贝是不一致的。
  kybase-objects:
    # MinIO 的对象数据（原件 / Markdown / 图片）
